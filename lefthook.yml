pre-commit:
  parallel: true
  commands:
    rust-fmt:
      root: src-tauri/
      glob: "*.rs"
      run: cargo fmt --check
    rust-clippy:
      root: src-tauri/
      glob: "*.rs"
      run: cargo clippy -- -D warnings
    frontend-typecheck:
      glob: "src/**/*.{ts,tsx}"
      run: npx tsc --noEmit
    frontend-test:
      glob: "src/**/*.{ts,tsx}"
      run: npm test
